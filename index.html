<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Mirror</title>
    <link rel="stylesheet" href="./src/boot.css" />
  </head>
  <body>
    <!-- Portrait Alpaca Intro -->
    <div id="intro" role="banner" aria-label="Alpaca Solutions">
      <div class="intro-stage">
        <svg class="bgpoly" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%">
          <polygon points="0,0 230,0 0,270" fill="#F3EEFC"></polygon>
          <polygon points="390,0 390,310 240,0" fill="#FFF5D6"></polygon>
          <polygon points="0,270 130,430 0,570" fill="#FAF7FF"></polygon>
          <polygon points="390,310 270,460 390,540" fill="#FFF9E8"></polygon>
          <polygon points="0,844 0,570 250,844" fill="#FFF3CF"></polygon>
          <polygon points="390,844 140,844 390,540" fill="#F1ECFB"></polygon>
        </svg>

        <div class="fl" style="left: 12%; top: 15%; width: 18px; height: 18px; background: #FDB912; --d: 7s"></div>
        <div class="fl" style="left: 82%; top: 11%; width: 14px; height: 14px; background: #523C94; --d: 8s"></div>
        <div class="fl" style="left: 86%; top: 47%; width: 22px; height: 22px; background: #FDB912; --d: 9s"></div>
        <div class="fl" style="left: 7%; top: 55%; width: 15px; height: 15px; background: #3C2774; --d: 6.5s"></div>
        <div class="fl" style="left: 18%; top: 80%; width: 12px; height: 12px; background: #523C94; --d: 8.5s"></div>
        <div class="fl" style="left: 80%; top: 77%; width: 18px; height: 18px; background: #FDB912; --d: 7.5s"></div>

        <div style="position: absolute; left: 0; right: 0; top: 130px; display: flex; flex-direction: column; align-items: center; gap: 44px">
          <div style="position: relative; width: 200px; height: 320px; display: flex; align-items: center; justify-content: center">
            <div class="intro-ring" style="left: 40px; top: 100px; border: 3px solid #FDB912"></div>
            <div class="intro-ring" style="left: 40px; top: 100px; border: 2px solid #7C63C9; animation-delay: 1.309s"></div>

            <div class="shard" style="left: 93px; top: 153px; width: 14px; height: 14px; background: #FDB912; --dx: -180px; --dy: -120px; --r: 200deg"></div>
            <div class="shard" style="left: 94px; top: 154px; width: 12px; height: 12px; background: #523C94; --dx: 170px; --dy: -150px; --r: -160deg"></div>
            <div class="shard" style="left: 92px; top: 152px; width: 16px; height: 16px; background: #FDB912; --dx: 220px; --dy: 20px; --r: 240deg"></div>
            <div class="shard" style="left: 95px; top: 155px; width: 10px; height: 10px; background: #3C2774; --dx: -230px; --dy: 40px; --r: -200deg"></div>
            <div class="shard" style="left: 93px; top: 153px; width: 14px; height: 14px; background: #523C94; --dx: -140px; --dy: 170px; --r: 180deg"></div>
            <div class="shard" style="left: 94px; top: 154px; width: 12px; height: 12px; background: #FDB912; --dx: 150px; --dy: 190px; --r: -220deg"></div>
            <div class="shard" style="left: 95px; top: 155px; width: 10px; height: 10px; background: #FDB912; --dx: 0px; --dy: -240px; --r: 160deg"></div>
            <div class="shard" style="left: 93px; top: 153px; width: 14px; height: 14px; background: #3C2774; --dx: 30px; --dy: 240px; --r: -140deg"></div>
            <div class="shard" style="left: 96px; top: 156px; width: 9px; height: 9px; background: #523C94; --dx: -90px; --dy: -215px; --r: 120deg"></div>
            <div class="shard" style="left: 95px; top: 155px; width: 10px; height: 10px; background: #3C2774; --dx: 240px; --dy: -70px; --r: 200deg"></div>
            <div class="shard" style="left: 94px; top: 154px; width: 12px; height: 12px; background: #FDB912; --dx: -250px; --dy: -40px; --r: -120deg"></div>
            <div class="shard" style="left: 96px; top: 156px; width: 8px; height: 8px; background: #523C94; --dx: 100px; --dy: -225px; --r: 90deg"></div>
            <div class="shard" style="left: 95px; top: 155px; width: 10px; height: 10px; background: #FDB912; --dx: -200px; --dy: 125px; --r: 150deg"></div>
            <div class="shard" style="left: 96px; top: 156px; width: 9px; height: 9px; background: #523C94; --dx: 200px; --dy: 120px; --r: -90deg"></div>

            <svg class="logo" viewBox="330 15 620 1220" width="163" height="320" role="img" aria-label="Alpaca Solutions logo" style="position: relative">
              <defs>
                <clipPath id="alpacaClip">
                  <polygon points="572,25 770,140 766,364 680,220"></polygon>
                  <polygon points="410,288 680,220 342,402"></polygon>
                  <polygon points="342,402 680,220 578,432 484,488"></polygon>
                  <polygon points="680,220 670,525 578,432"></polygon>
                  <polygon points="680,220 766,364 670,525"></polygon>
                  <polygon points="766,364 935,660 670,525"></polygon>
                  <polygon points="670,525 935,660 503,817"></polygon>
                  <polygon points="503,817 935,660 612,1225"></polygon>
                </clipPath>
                <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"></stop>
                  <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".75"></stop>
                  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
                </linearGradient>
              </defs>
              <polygon class="f" points="503,817 935,660 612,1225" fill="#523C94" style="--x: -60px; --y: 700px; --r: -140deg; animation-delay: 0.152s"></polygon>
              <polygon class="f" points="670,525 935,660 503,817" fill="#FDB912" style="--x: 640px; --y: 260px; --r: 160deg; animation-delay: 0.243s"></polygon>
              <polygon class="f" points="766,364 935,660 670,525" fill="#523C94" style="--x: 700px; --y: -120px; --r: -200deg; animation-delay: 0.335s"></polygon>
              <polygon class="f" points="680,220 766,364 670,525" fill="#FDB912" style="--x: 520px; --y: -560px; --r: 220deg; animation-delay: 0.426s"></polygon>
              <polygon class="f" points="680,220 670,525 578,432" fill="#523C94" style="--x: -620px; --y: 300px; --r: -180deg; animation-delay: 0.502s"></polygon>
              <polygon class="f" points="342,402 680,220 578,432 484,488" fill="#3C2774" style="--x: -720px; --y: 80px; --r: 140deg; animation-delay: 0.578s"></polygon>
              <polygon class="f" points="410,288 680,220 342,402" fill="#FDB912" style="--x: -560px; --y: -480px; --r: -220deg; animation-delay: 0.654s"></polygon>
              <polygon class="f" points="572,25 770,140 766,364 680,220" fill="#3C2774" style="--x: 80px; --y: -760px; --r: 180deg; animation-delay: 0.73s"></polygon>
              <g clip-path="url(#alpacaClip)">
                <rect class="shine" x="-700" y="0" width="190" height="1300" fill="url(#shineGrad)"></rect>
              </g>
            </svg>
          </div>

          <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
            <div class="w1" style="display: flex; gap: 1px; font-weight: 800; font-size: 46px; line-height: 1; color: #3C2774; letter-spacing: .01em">
              <span>A</span><span>L</span><span>P</span><span>A</span><span>C</span><span>A</span>
            </div>
            <div style="display: flex; align-items: center; gap: 12px">
              <div class="ln" style="width: 26px; height: 2px; background: #FDB912; transform-origin: right"></div>
              <div class="w2" style="font-weight: 500; font-size: 13px; color: #523C94; letter-spacing: .55em; padding-left: .55em">SOLUTIONS</div>
              <div class="ln" style="width: 26px; height: 2px; background: #FDB912; transform-origin: left"></div>
            </div>
          </div>
        </div>

        <div class="flash"></div>
      </div>
      <div class="intro-error" role="alert" hidden>
        <p>Không thể tải trò chơi. Vui lòng thử lại.</p>
        <button class="intro-retry-btn" type="button">Thử lại</button>
      </div>
    </div>

    <div id="pc-bg" aria-hidden="true"><div class="pc-bg-layer"></div><div class="pc-bg-layer"></div></div>
    <div id="game"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
