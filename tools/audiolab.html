<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phòng âm thanh · Mirror Audio Lab</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: #070a14;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.hint { color: #94a3b8; font-size: 13px; margin: 0 0 20px; }
      .cues { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
      button {
        background: #14213d; color: #e2e8f0; border: 1px solid #334155;
        border-radius: 8px; padding: 10px 14px; font-size: 14px; cursor: pointer;
      }
      button:hover { border-color: #7fd8ff; }
      button.active { border-color: #7fd8ff; background: #1e3a5f; }
      .panel { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
      .params { display: flex; flex-direction: column; gap: 10px; }
      .row { display: grid; grid-template-columns: 1fr; gap: 2px; font-size: 12px; }
      .row input { width: 100%; }
      .row span { color: #94a3b8; font-family: ui-monospace, monospace; word-break: break-all; }
      #wave { width: 100%; background: #0b1020; border: 1px solid #1e293b; border-radius: 8px; }
      #stats { font-family: ui-monospace, monospace; font-size: 12px; color: #94a3b8; margin-top: 8px; }
      #problem {
        margin-top: 8px; padding: 8px 10px; white-space: pre-wrap; font-family: ui-monospace, monospace;
        font-size: 12px; color: #fecaca; background: #3b1219; border: 1px solid #7f1d1d; border-radius: 8px;
      }
      #problem[hidden] { display: none; }
      h2 { font-size: 17px; margin: 0 0 4px; }
      .grid { border-collapse: collapse; margin-bottom: 16px; }
      .grid th {
        color: #94a3b8; font-size: 12px; font-weight: 500;
        padding: 4px 8px; text-align: right; font-family: ui-monospace, monospace;
      }
      .grid td { padding: 2px; }
      .grid td button { padding: 6px 10px; font-size: 13px; }
      .status {
        margin-top: 12px; font-family: ui-monospace, monospace; font-size: 12px;
        color: #94a3b8; padding: 8px 10px; background: #0b1020;
        border: 1px solid #1e293b; border-radius: 8px;
      }
      .cues .label { color: #94a3b8; font-size: 13px; align-self: center; margin-right: 4px; }
      .resonance { margin-top: 32px; padding-top: 24px; border-top: 1px solid #1e293b; }
      .resonance .params { max-width: 420px; margin-top: 16px; }
      textarea {
        width: 100%; height: 220px; margin-top: 12px; background: #0b1020; color: #cbd5e1;
        border: 1px solid #1e293b; border-radius: 8px; padding: 10px;
        font-family: ui-monospace, monospace; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Phòng âm thanh</h1>
    <p class="hint">
      Bấm một cue để nghe. Kéo slider để chỉnh, nghe lại ngay. Xong thì bấm
      <strong>Copy as TypeScript</strong> và dán vào <code>src/content/audio/sources/</code>.
    </p>
    <div class="cues" id="cues"></div>
    <div class="cues">
      <button id="ladder">▶ Thang ngũ cung (bell ×8)</button>
      <button id="copy">Copy as TypeScript</button>
      <button id="reset">Khôi phục gốc</button>
    </div>
    <div class="panel">
      <div class="params" id="params"></div>
      <div>
        <canvas id="wave" width="640" height="120"></canvas>
        <div id="stats"></div>
        <div id="problem" hidden role="alert"></div>
        <textarea id="out" readonly></textarea>
      </div>
    </div>
    <div class="resonance" id="instruments"></div>
    <div class="resonance" id="resonance"></div>
    <script type="module" src="/src/devtools/audiolab/main.ts"></script>
  </body>
</html>
